services:
  - type: web
    name: ngrok-tunnel
    image: ngrok/ngrok:latest
    plan: free
    envVars:
      - key: NGROK_AUTHTOKEN
        sync: true
    startCommand: ngrok http --log=stdout n8n:5678

  - type: web
    name: n8n
    image: docker.io/n8nio/n8n:latest
    plan: free
    envVars:
      - key: N8N_PROTOCOL
        value: "https"
      - key: N8N_HOST
        fromService:
          type: web
          name: ngrok-tunnel
          envVarKey: RENDER_EXTERNAL_URL
      - key: WEBHOOK_TUNNEL_URL
        fromService:
          type: web
          name: ngrok-tunnel
          envVarKey: RENDER_EXTERNAL_URL
      - key: N8N_PORT
        value: "5678"
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db
          property: database
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db
          property: host
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db
          property: password
    healthCheckPath: /healthz

databases:
  - name: n8n-db
    plan: free
