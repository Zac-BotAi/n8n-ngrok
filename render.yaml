services:
  - type: web
    name: n8n
    # Specify the official n8n Docker Image
    image: docker.n8n.io/n8nio/n8n:latest
    autoDeploy: false
    plan: free
    envVars:
      - key: N8N_HOST
        # This will be the external URL provided by Render/Ngrok
        value: ${N8N_HOST} # This assumes N8N_HOST will be set by Render or Ngrok
      - key: N8N_PROTOCOL
        value: "http"
      - key: N8N_TUNNEL_URL
        value: "{{ .Env.N8N_TUNNEL_URL }}" # This gets the Ngrok URL from the ngrok-tunnel service
      - key: N8N_PUSH_WEBHOOK_PORT
        value: 5555
      - key: N8N_PUSH_WEBHOOK_BASE_URL
        value: http://n8n:5555 # Internal communication: n8n service reaching itself

  - type: web
    name: ngrok-tunnel
    # Specify the official Ngrok Docker Image (or a compatible one)
    image: ngrok/ngrok:latest # Assuming this is the image your repo intends to use
    autoDeploy: false
    plan: free
    envVars:
      - key: N8N_TUNNEL_URL
        value: "{{ .Env.N8N_TUNNEL_URL }}" # This will be the output URL of ngrok
      - key: NGROK_AUTHTOKEN
        sync: true # This will pull the token from your Render environment secrets
    # Ngrok usually just needs the tunnel URL and auth token to start
    # No need for dockerfile/build if pulling an image
