services:
  - type: web
    name: n8n
    runtime: image
    image: n8nio/n8n:latest
    plan: free
    envVars:
      - key: N8N_PROTOCOL
        value: "https"
      - key: N8N_HOST
        value: "your_n8n_service_url" # Replace this with a valid URL if needed.
      - key: N8N_PORT
        value: "5678"
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
    healthCheckPath: /healthz
