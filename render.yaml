services:
  - type: web
    name: ngrok-tunnel
    runtime: image
    image: ngrok/ngrok:latest
    plan: free
    envVars:
      - key: NGROK_AUTHTOKEN
        sync: true
    startCommand: ngrok http --log=stdout n8n:5678

  - type: web
    name: n8n
    runtime: image
    image: docker.io/n8nio/n8n:latest
    plan: free
    envVars:
      - key: N8N_PROTOCOL
        value: "https"
      - key: N8N_HOST
        fromService:
          type: web
          name: ngrok-tunnel
          envVarKey: RENDER_EXTERNAL_URL
      - key: WEBHOOK_TUNNEL_URL
        fromService:
          type: web
          name: ngrok-tunnel
          envVarKey: RENDER_EXTERNAL_URL
      - key: N8N_PORT
        value: "5678"
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
    healthCheckPath: /healthz
