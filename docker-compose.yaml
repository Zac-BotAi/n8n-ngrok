version: "3.9"

services:
  n8n:
    container_name: n8n
    image: docker.n8n.io/n8nio/n8n:latest
    environment:
      - TZ=${TIMEZONE}
      - GENERIC_TIMEZONE=${TIMEZONE}
      - N8N_PORT=${PORT:-5678}
      - WEBHOOK_URL=${URL} # Re-added for ngrok. If URL is not in .env, n8n should auto-detect.
    ports:
      - "5678:5678" # Expose port for local access without ngrok
    networks:
      - n8n-network
    volumes:
      - n8n_data:/home/node/.n8n

  ngrok:
    container_name: ngrok
    image: ngrok/ngrok:latest
    profiles:
      - ngrok # This service will only start if the 'ngrok' profile is activated
    environment:
      - NGROK_AUTHTOKEN=${NGROK_TOKEN} # Must be set in .env when using ngrok profile
    command:
      - "http"
      - "n8n:5678" # Forward to n8n service on port 5678
      # Users can add --domain your-reserved.domain.ngrok-free.app here if they have one,
      # or configure it via NGROK_DOMAIN in .env and use it in the command.
      # For simplicity, basic http forwarding is set up.
      # The original command used a config file:
      # - "start"
      # - "--all"
      # - "--config"
      # - "/etc/ngrok.yml"
      # The command "ngrok http n8n:5678" is simpler for a single tunnel.
    networks:
      - n8n-network
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml # Still mount it in case user customizes it
    depends_on:
      - n8n

volumes:
  n8n_data:

networks:
  n8n-network:
    driver: bridge
